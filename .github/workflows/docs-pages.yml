name: Publish public documentation

on:
  workflow_dispatch:
    inputs:
      withdraw_tegra_artifacts:
        description: "Deliberate withdrawal only: comma-separated Tegra wheel or tarball filenames now on Pages that this deployment removes"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs-pages.yml
      - docs/**
      - mkdocs.yml
      - scripts/release/build-pages-site.sh
      - scripts/release/build-tegra-pages-index.sh
      - scripts/release/check-tegra-pages-retention-live.sh
      - scripts/release/fetch-tegra-pages-retained.sh
      - scripts/release/tegra-pages-retained.json
      - scripts/release/tegra-pages-retained.py
      - scripts/release/verify-tegra-pages-live.sh

permissions:
  contents: read

concurrency:
  group: ${{ format('github-pages-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  prepare-pages:
    name: Build docs with retained Tegra package index
    runs-on: ubuntu-latest
    outputs:
      site_root: ${{ steps.site.outputs.site_root }}
      retained_artifacts: ${{ steps.site.outputs.retained_artifacts }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the documentation builder
        run: python3 -m pip install --disable-pip-version-check mkdocs
      # Each deployment replaces the whole site, so every published Tegra
      # wheel and Node tarball in the retained list is rebuilt from its
      # pinned SHA-256; the Jetson Pages route consumes the same list.
      - id: site
        name: Build the combined Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          retained_dir="$RUNNER_TEMP/fathomdb-retained-tegra-artifacts"
          bash scripts/release/fetch-tegra-pages-retained.sh --manifest scripts/release/tegra-pages-retained.json \
            --dest "$retained_dir"
          site_root="$RUNNER_TEMP/fathomdb-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          site_result="$(bash scripts/release/build-pages-site.sh \
            --manifest scripts/release/tegra-pages-retained.json --artifact-dir "$retained_dir" \
            --out "$site_root")"
          retained_artifacts="$(sed -n 's/^retained_artifacts=//p' <<<"$site_result")"
          [[ "$retained_artifacts" =~ ^[1-9][0-9]*$ ]] || {
            printf 'combined site builder retained no Tegra artifact: %s\n' "$site_result" >&2
            exit 1
          }
          printf 'site_root=%s\n' "$site_root" >> "$GITHUB_OUTPUT"
          printf 'retained_artifacts=%s\n' "$retained_artifacts" >> "$GITHUB_OUTPUT"
      # The site is rebuilt from the retained list, so anything live that the
      # list misses would vanish; only a named withdrawal may remove it.
      - name: Refuse to withdraw a live Tegra artifact unannounced
        shell: bash
        env:
          WITHDRAW_TEGRA_ARTIFACTS: ${{ inputs.withdraw_tegra_artifacts }}
        run: |
          set -euo pipefail
          bash scripts/release/check-tegra-pages-retention-live.sh --manifest scripts/release/tegra-pages-retained.json \
            --withdraw "$WITHDRAW_TEGRA_ARTIFACTS"
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages
          path: ${{ steps.site.outputs.site_root }}

  deploy-pages:
    name: Deploy public documentation
    needs: prepare-pages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy combined site to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # The deployment is correct only if every retained Tegra artifact is served
  # at its public URL with its pinned SHA-256 and linked from the index pages.
  # Separate from the deploy job so that job keeps no contents permission.
  verify-pages-live:
    name: Verify the deployed Tegra artifacts from their public URLs
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify every retained Tegra artifact live
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/verify-tegra-pages-live.sh --manifest scripts/release/tegra-pages-retained.json
