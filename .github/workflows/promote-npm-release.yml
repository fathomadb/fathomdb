name: Promote npm release

# Verified finalization recovery; the opt-in .30 route replaces only its
# affected public smokes while retaining the original production proofs.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Published X.Y.Z version to promote"
        required: true
        type: string
      release_run_id:
        description: "Production release.yml run with green publish and smoke jobs"
        required: true
        type: string
      recover_0830_public_smokes:
        description: "Recover only affected consumers from production 0.8.30 attempt 1"
        required: false
        default: false
        type: boolean
      recover_0831_crates_sdk:
        description: "Recover only post-publish-smoke (crates-sdk) from production 0.8.31 attempt 1"
        required: false
        default: false
        type: boolean
      candidate_sha:
        description: "Exact tagged source commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-production:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require exact tag and original production proofs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          RUN_ID: ${{ inputs.release_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RECOVER: ${{ inputs.recover_0830_public_smokes }}
          RECOVER_0831: ${{ inputs.recover_0831_crates_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$RECOVER" = true ]; then extra+=(--recover-0830-public-smokes); fi
          if [ "$RECOVER_0831" = true ]; then extra+=(--recover-0831-crates-sdk); fi
          python3 scripts/release/verify-public-smoke-recovery.py "$VERSION" "$RUN_ID" "$CANDIDATE_SHA" "${extra[@]}"

  recover-public-smokes:
    needs: verify-production
    if: ${{ inputs.recover_0830_public_smokes && needs.verify-production.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            npm: false
          - runner: macos-15-intel
            npm: false
          - runner: macos-15
            npm: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.npm
        with:
          node-version: "25.9.0"
          package-manager-cache: false
      - name: Smoke exact registry Python with the system Bash
        shell: bash
        run: /bin/bash scripts/release/smoke/smoke-pypi-wheel.sh "$VERSION"
      - name: Smoke exact registry macOS ARM npm
        if: matrix.npm
        shell: bash
        run: /bin/bash scripts/release/smoke/smoke-npm-package.sh "$VERSION"

  recover-crates-sdk-smoke:
    needs: verify-production
    if: ${{ inputs.recover_0831_crates_sdk && needs.verify-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Smoke exact registry Rust SDK
        shell: bash
        run: bash scripts/release/smoke/smoke-crates-sdk.sh "$VERSION"

  promote-npm-latest:
    needs: [verify-production, recover-public-smokes, recover-crates-sdk-smoke]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.verify-production.result == 'success' && ((inputs.recover_0830_public_smokes && needs.recover-public-smokes.result == 'success') || (!inputs.recover_0830_public_smokes && needs.recover-public-smokes.result == 'skipped')) && ((inputs.recover_0831_crates_sdk && needs.recover-crates-sdk-smoke.result == 'success') || (!inputs.recover_0831_crates_sdk && needs.recover-crates-sdk-smoke.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          package-manager-cache: false
      - name: Install npm CLI with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Promote and verify the main package
        env:
          VERSION: ${{ inputs.release_version }}
        shell: bash
        run: python3 scripts/release/promote-npm-latest.py "$VERSION"

  github-release:
    needs: promote-npm-latest
    if: ${{ !cancelled() && needs.promote-npm-latest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Extract CHANGELOG release notes
        env:
          VERSION: ${{ inputs.release_version }}
        shell: bash
        run: bash scripts/release/extract-changelog-section.sh "$VERSION" CHANGELOG.md "$RUNNER_TEMP/release-body.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.release_version != '0.8.30' }}
        with:
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          pattern: python-cli-dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.release_version != '0.8.30' }}
        with:
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          name: inspector-linux-x64-gnu
          path: dist
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: v${{ inputs.release_version }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/*
