name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse cargo publish --dry-run + npm --dry-run; PyPI publish + post-publish smoke skipped entirely (no test.pypi slot burn)."
        type: boolean
        default: true
      release_version:
        description: "Required semver version; must match Axis W and derives the prospective dry-run or canonical publish tag."
        type: string
        required: true
      candidate_commit:
        description: "Dry-run only: required immutable full 40-hex commit SHA. Every release job checks out exactly this candidate; no v-tag is needed."
        type: string
      confirm_release_version:
        description: "Required when dry_run is unchecked: type the exact Axis-W version to confirm a real publish."
        type: string
      recovery_skip_npm:
        description: "v0.8.20 recovery only: publish crates.io + PyPI from the immutable tag, but skip npm and leave the release partial."
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  id-token: write

env:
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
  RELEASE_DISPATCH_VERSION: ${{ inputs.release_version || '' }}
  RELEASE_CONFIRM_VERSION: ${{ inputs.confirm_release_version || '' }}
  RELEASE_GATES_CANDIDATE_COMMIT: ${{ inputs.candidate_commit || '' }}
  # A dry-run dispatch must exercise its explicitly selected immutable commit,
  # never the mutable UI branch tip or a v-tag whose push would publish. Real
  # tag pushes and non-dry-run recovery dispatches use the canonical v-tag.
  RELEASE_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && inputs.candidate_commit || github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.release_version) || github.ref }}
  RELEASE_GATES_REQUIRE_TAG_CHECKOUT: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && '1' || '0' }}
  # 0.8.22 supports Linux glibc x64/ARM64, macOS x64/ARM64, and Windows x64.
  # Musl and every other target remain unsupported. Every package first
  # publishes under `next`; only the main `fathomdb` package is promoted to
  # `latest` after all five actual-runner registry smokes and co-tagging pass.
  NPM_DIST_TAG: "next"

jobs:
  # Advisory full-history secret scan from the selected release candidate's
  # checkout (the history script mirrors and scans every fetched ref).
  # Independent by design: no `needs`, and no build, publisher, smoke,
  # promotion, or finalization job may depend on it. `continue-on-error` keeps
  # it visible on the run without gating publication while the history
  # allowlist baseline remains noisy
  # (dev/design/ci-cd-simplified-redesign-20260821.md §4).
  # Per-push CI scans only the current tree; the same scan is also available
  # on demand via .github/workflows/gitleaks-history.yml.
  gitleaks-history-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Scan reachable Git history
        run: bash scripts/security/gitleaks-history.sh

  # Single ubuntu preflight. Combines:
  #   - scripts/verify-release-gates.sh (tag↔Cargo.toml lockstep, set-version
  #     --check-files lockstep, HEAD-on-main, CHANGELOG section, crate
  #     publish metadata).
  #   - actionlint on all workflow files (per feedback_workflow_validation —
  #     yaml.safe_load passes schema-invalid syntax GitHub silently rejects).
  verify-release:
    needs: verify-cuda-trusted-route
    if: ${{ always() && needs.verify-cuda-trusted-route.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          fetch-depth: 0  # need refs/heads/main for HEAD-reach check
          persist-credentials: false
      - name: Print resolved dry-run mode
        run: echo "DRY_RUN=${DRY_RUN}"
      - name: Validate v0.8.20 recovery scope
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true }}
        run: |
          if [ "$RELEASE_TAG" != "v0.8.20" ]; then
            echo "recovery_skip_npm is restricted to the immutable v0.8.20 recovery tag" >&2
            exit 1
          fi
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12
          sudo mv actionlint /usr/local/bin/actionlint
      - name: Validate workflow YAML
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml
      - name: Run release gates
        # Runs on push (tag-format + version-axis enforced) and dispatch.
        # Dry runs require and verify the selected full candidate SHA; non-dry
        # recovery remains canonical-tag-only and needs typed confirmation.
        #
          # RELEASE_GATES_HEAD_REF points at the remote-tracking main ref,
          # because checkout can be either the selected dry-run commit or a tag.
        run: bash scripts/verify-release-gates.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GATES_HEAD_REF: refs/remotes/origin/main
          RELEASE_GATES_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_GATES_CANDIDATE_COMMIT: ${{ env.RELEASE_GATES_CANDIDATE_COMMIT }}
          RELEASE_DISPATCH_VERSION: ${{ env.RELEASE_DISPATCH_VERSION }}
          RELEASE_GATES_REQUIRE_TAG_CHECKOUT: ${{ env.RELEASE_GATES_REQUIRE_TAG_CHECKOUT }}
      - name: Axis-E published-API drift guard
        # Catches the v0.8.9 partial-publish class BEFORE any tier uploads:
        # if fathomdb-embedder-api's pinned Axis-E version is already on
        # crates.io but its local source surface differs, a consumer
        # (engine/cli/...) may call an API absent from the published crate,
        # which only `cargo publish` verify would otherwise surface — after
        # earlier tiers have uploaded immutably. The release dry-run uses
        # --no-verify, so this guard is what makes that case fail pre-tag.
        # Queries crates.io directly (read-only, fail-closed on any error).
        run: bash scripts/release/verify-embedder-api-no-drift.sh

  # Slice 10: this job decides CUDA runner eligibility without executing any
  # candidate script. It is intentionally hosted; the self-hosted preflight
  # below may start only after this default-branch-owned check passes.
  verify-cuda-trusted-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_authorized: ${{ steps.route.outputs.authorized || steps.canonical.outputs.authorized }}
      manifest_sha256: ${{ steps.route.outputs.manifest_sha256 || steps.canonical.outputs.manifest_sha256 }}
    steps:
      # `github.workflow_sha` is the reviewed, main-owned control plane. Never
      # check out candidate-owned code in this job.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, main-owned control plane only
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify canonical tag or non-dry-run route
        id: canonical
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.candidate_commit || '' }}" != '' ]; then
            echo "candidate_commit is forbidden outside a dry-run dispatch" >&2
            exit 1
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo 'manifest_sha256=canonical-route' >> "$GITHUB_OUTPUT"
      - name: Bind selected main candidate to this dry run
        id: main-route
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          if [ "${{ github.workflow_ref }}" != 'fathomadb/fathomdb/.github/workflows/release.yml@refs/heads/main' ]; then
            echo 'CUDA dry runs must run from the main release workflow' >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'CUDA dry runs require a lowercase 40-hex SHA' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          python3 - "$CANDIDATE_SHA" '${{ github.workflow_ref }}' '${{ github.workflow_sha }}' '${{ github.run_id }}' '${{ github.run_attempt }}' > cuda-unmerged-route-receipt.json <<'PY'
          import json
          import sys
          candidate_sha, workflow_ref, workflow_sha, run_id, run_attempt = sys.argv[1:]
          print(json.dumps({
              "schema_version": "fathomdb.cuda-main-route-receipt/v2",
              "candidate_sha": candidate_sha,
              "workflow_ref": workflow_ref,
              "workflow_sha": workflow_sha,
              "run_id": int(run_id),
              "run_attempt": int(run_attempt),
          }, ensure_ascii=True, separators=(",", ":"), sort_keys=True))
          PY
      - name: Fetch and normalize read-only candidate review facts
        id: facts
        if: ${{ github.event_name == 'retired' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.workflow_ref }}" != 'fathomadb/fathomdb/.github/workflows/release.yml@refs/heads/main' ]; then
            echo 'unmerged CUDA candidate route must run from the main release workflow' >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'unmerged CUDA candidate route requires a lowercase 40-hex SHA' >&2
            exit 1
          fi
          # The protection-baseline attestation is an external prerequisite. A
          # missing, malformed, or expired file is deliberately a hard failure.
          test -f dev/release/cuda-protection-baseline.json
          candidate_pr="$(curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/pulls" \
            | python3 -c 'import json, sys; rows=json.load(sys.stdin); assert isinstance(rows, list) and len(rows) == 1; print(rows[0]["number"])')"
          curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$candidate_pr" > pull-request.json
          curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$candidate_pr/reviews?per_page=100" > reviews.json
          provenance_pr="$(python3 - "$CANDIDATE_SHA" dev/release/cuda-unmerged-candidates.json <<'PY'
          import json
          import sys
          candidate_sha, manifest_path = sys.argv[1:]
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          records = [item for item in manifest["candidates"] if item.get("candidate_sha") == candidate_sha]
          assert len(records) == 1
          print(records[0]["provenance_pr"])
          PY
          )"
          curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$provenance_pr" > provenance-pull-request.json
          curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$provenance_pr/reviews?per_page=100" > provenance-reviews.json
          python3 - "$CANDIDATE_SHA" pull-request.json reviews.json provenance-pull-request.json provenance-reviews.json dev/release/cuda-protection-baseline.json route-facts.json <<'PY'
          import hashlib
          import json
          import sys

          candidate_sha, pr_path, reviews_path, provenance_pr_path, provenance_reviews_path, baseline_path, output_path = sys.argv[1:]
          def canonical(value):
              return json.dumps(value, ensure_ascii=True, separators=(",", ":"), sort_keys=True).encode("ascii") + b"\n"
          def digest(value):
              return hashlib.sha256(canonical(value)).hexdigest()
          pr_raw = json.load(open(pr_path, encoding="utf-8"))
          reviews_raw = json.load(open(reviews_path, encoding="utf-8"))
          provenance_pr_raw = json.load(open(provenance_pr_path, encoding="utf-8"))
          provenance_reviews_raw = json.load(open(provenance_reviews_path, encoding="utf-8"))
          baseline = json.load(open(baseline_path, encoding="utf-8"))
          pr = {
              "number": pr_raw["number"], "state": pr_raw["state"], "draft": pr_raw["draft"],
              "base": {"ref": pr_raw["base"]["ref"], "repo_full_name": pr_raw["base"]["repo"]["full_name"]},
              "head": {"sha": pr_raw["head"]["sha"], "repo_full_name": pr_raw["head"]["repo"]["full_name"]},
              "user": {"login": pr_raw["user"]["login"]},
          }
          reviews = [{
              "id": item["id"], "user": {"login": item["user"]["login"]},
              "state": item["state"], "commit_id": item["commit_id"], "submitted_at": item["submitted_at"],
          } for item in reviews_raw]
          provenance_pr = {
              "number": provenance_pr_raw["number"], "state": provenance_pr_raw["state"], "merged": provenance_pr_raw["merged"],
              "base": {"ref": provenance_pr_raw["base"]["ref"], "repo_full_name": provenance_pr_raw["base"]["repo"]["full_name"]},
              "head": {"sha": provenance_pr_raw["head"]["sha"], "repo_full_name": provenance_pr_raw["head"]["repo"]["full_name"]},
              "merge_commit_sha": provenance_pr_raw["merge_commit_sha"], "user": {"login": provenance_pr_raw["user"]["login"]},
          }
          provenance_reviews = [{
              "id": item["id"], "user": {"login": item["user"]["login"]},
              "state": item["state"], "commit_id": item["commit_id"], "submitted_at": item["submitted_at"],
          } for item in provenance_reviews_raw]
          facts = {
              "schema_version": "fathomdb.cuda-unmerged-candidate-facts/v1",
              "protection_baseline": baseline,
              "pull_request": pr,
              "reviews": reviews,
              "reviews_pagination_complete": len(reviews_raw) < 100,
              "provenance_pull_request": provenance_pr,
              "provenance_reviews": provenance_reviews,
              "provenance_reviews_pagination_complete": len(provenance_reviews_raw) < 100,
              "api_response_sha256": {
                  "protection_baseline": digest(baseline), "pull_request": digest(pr), "reviews": digest(reviews),
                  "provenance_pull_request": digest(provenance_pr), "provenance_reviews": digest(provenance_reviews),
              },
          }
          open(output_path, "wb").write(canonical(facts))
          PY
      - name: Authorize one exact unmerged candidate
        id: route
        if: ${{ github.event_name == 'retired' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify-cuda-unmerged-candidate.py authorize \
            --manifest dev/release/cuda-unmerged-candidates.json \
            --facts route-facts.json \
            --candidate-sha '${{ inputs.candidate_commit }}' \
            --workflow-ref '${{ github.workflow_ref }}' \
            --workflow-sha '${{ github.workflow_sha }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --receipt cuda-unmerged-route-receipt.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload unmerged-candidate route receipt
        if: ${{ github.event_name == 'retired' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-unmerged-route-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: cuda-unmerged-route-receipt.json
          if-no-files-found: error
      - name: Upload main-candidate route receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-unmerged-route-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: cuda-unmerged-route-receipt.json
          if-no-files-found: error

  # Slice 0: a dry-run release dispatch from the trusted main workflow is the
  # only non-publishing route to the restricted CUDA runner group.
  cuda-contract-preflight:
    needs: [verify-release, verify-cuda-trusted-route]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda-12]
    environment: cuda-unmerged-preflight
    env:
      FATHOMDB_CUDA_GPU_UUID: ${{ vars.FATHOMDB_CUDA_GPU_UUID }}
      CUDA_HOME: /usr/local/cuda-12.6
      CUDA_PATH: /usr/local/cuda-12.6
      LIBRARY_PATH: /usr/local/cuda-12.6/targets/x86_64-linux/lib
      CUDARC_CUDA_VERSION: "12060"
      CUDA_PREFLIGHT_WITNESS_DIR: ${{ github.workspace }}/cuda-preflight-witness-${{ github.run_id }}-${{ github.run_attempt }}
      CUDA_RERANK_PREFLIGHT_WITNESS_DIR: ${{ github.workspace }}/cuda-rerank-preflight-witness-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, main-owned receipt verifier only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        with:
          ref: ${{ github.workflow_sha }}
          path: control-plane
          persist-credentials: false
      - name: Download same-run unmerged route receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-unmerged-route-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-plane/receipt
      - name: Verify same-run unmerged route receipt before candidate checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 control-plane/scripts/release/verify-cuda-unmerged-receipt.py \
            --receipt control-plane/receipt/cuda-unmerged-route-receipt.json \
            --manifest control-plane/dev/release/cuda-unmerged-candidates.json \
            --candidate-sha '${{ inputs.candidate_commit }}' \
            --workflow-ref '${{ github.workflow_ref }}' \
            --workflow-sha '${{ github.workflow_sha }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, hosted route and receipt verified
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Install N-API build dependencies
        working-directory: candidate/src/ts
        run: npm ci
      - name: Capture CUDA artifact preflight witness
        working-directory: candidate
        run: bash scripts/release/cuda-preflight.sh "$CUDA_PREFLIGHT_WITNESS_DIR"
      - name: Capture candidate-only CUDA reranker v3 preflight witness
        working-directory: candidate
        run: bash scripts/release/cuda-preflight.sh "$CUDA_RERANK_PREFLIGHT_WITNESS_DIR" --rerank-cuda
      - name: Upload CUDA preflight witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-preflight-witness
          path: ${{ env.CUDA_PREFLIGHT_WITNESS_DIR }}
          if-no-files-found: error
      - name: Upload CUDA preflight package bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-preflight-packages
          path: ${{ env.CUDA_PREFLIGHT_WITNESS_DIR }}.packages
          if-no-files-found: error
      - name: Upload CUDA reranker v3 preflight witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-rerank-preflight-witness
          path: ${{ env.CUDA_RERANK_PREFLIGHT_WITNESS_DIR }}
          if-no-files-found: error
      - name: Upload CUDA reranker v3 package bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-rerank-preflight-packages
          path: ${{ env.CUDA_RERANK_PREFLIGHT_WITNESS_DIR }}.packages
          if-no-files-found: error

  # Native Linux Python wheels via PyO3/maturin-action. The
  # working-directory must be `src/python` so maturin reads our pyproject.toml
  # there (manifest-path = ../rust/crates/fathomdb-py/Cargo.toml).
  # 0.8.22's stable native-artifact matrix is Linux glibc x64/ARM64, macOS
  # x64/ARM64, and Windows x64. Musl and other targets remain unsupported.
  build-python:
    needs: [verify-release, verify-cuda-trusted-route]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            interpreters: "python3.10 python3.11 python3.12"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "auto"
            interpreters: "python3.10 python3.11 python3.12"
          - runner: macos-14
            target: aarch64-apple-darwin
            manylinux: "auto"
            interpreters: "python3.10 python3.11 python3.12"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "auto"
            interpreters: "python"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # Explicit -i: cross-compile Docker containers can pick up
          # python3.14 which pyo3 0.23 does not support. Bump alongside the
          # pyo3 upgrade landing in dev/notes/pyo3-0.28-upgrade-plan.md.
          #
          # EU-6 FIX-1: explicit `--features` list (NOT pyproject discovery).
          # The shipped feature axis is locked here per
          # `dev/design/0.7.1-EU-6-FIX-1-design.md` D1: `default-embedder`
          # ON (so `use_default_embedder=True` works on the published
          # wheel), `test-hooks` deliberately absent (dev-only surface).
          args: --release --out dist --features pyo3/extension-module,default-embedder -i ${{ matrix.interpreters || 'python3.10 python3.11 python3.12' }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: src/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ matrix.target }}
          path: src/python/dist/*

  # Native binding prebuilds for npm. The napi-rs CLI handles the rename to
  # fathomdb.<platform-label>.node per the `napi.triples` block in
  # src/ts/package.json — prefer this over a raw `cargo build` + manual cp
  # because the platform-label convention lives in the napi-rs CLI, not in
  # us. Binary lands flat at src/ts/fathomdb.<label>.node (NO prebuilds/
  # subdir; that was the pre-0.6.0 layout).
  # Keep this identical to the Python stable matrix so the npm package
  # topology and actual native build coverage cannot drift apart.
  build-napi:
    needs: [verify-release, verify-cuda-trusted-route]
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            label: darwin-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: win32-x64-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          persist-credentials: false
      # Slice 80.1 (AC80-1/R80-2): linux-arm64-gnu is the one glibc-relevant
      # row here (macOS/Windows carry no glibc floor). It builds inside the
      # digest-pinned manylinux_2_28 container below instead of on the bare
      # runner, so the shipped .node artifact shares the same declared
      # glibc 2.28 floor as the Python wheel rather than whatever glibc
      # ubuntu-24.04-arm happens to carry. The steps in this block are
      # skipped for that row; its own containerized steps follow.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ matrix.label != 'linux-arm64-gnu' }}
        with:
          node-version: "25.9.0"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        if: ${{ matrix.label != 'linux-arm64-gnu' }}
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: ${{ matrix.label != 'linux-arm64-gnu' }}
      - name: Install ts deps
        if: ${{ matrix.label != 'linux-arm64-gnu' }}
        working-directory: src/ts
        run: npm ci
      - name: Build napi binding
        if: ${{ matrix.label != 'linux-arm64-gnu' }}
        working-directory: src/ts
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: npm run build:native
      - name: Provision napi manylinux image
        if: ${{ matrix.label == 'linux-arm64-gnu' }}
        run: bash scripts/release/provision-napi-manylinux.sh
      - name: Build napi binding (containerized manylinux_2_28)
        if: ${{ matrix.label == 'linux-arm64-gnu' }}
        # Workspace is mounted read-write (unlike cuda-preflight.sh's
        # read-only wheel-build mount): napi build writes fathomdb.<label>.node
        # directly into the mounted src/ts tree, with no maturin-style --out
        # redirect to a separate witness dir. --user maps container output to
        # the host uid/gid, so this is not a root-write escalation.
        run: |
          . scripts/release/napi-artifact-contract.sh
          docker run --rm --platform "$NAPI_MANYLINUX_PLATFORM" \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace/src/ts \
            -e CARGO_BUILD_TARGET=${{ matrix.target }} \
            -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache \
            -e CARGO_HOME=/tmp/fathomdb-cargo -e CARGO_TARGET_DIR=/tmp/fathomdb-cargo-target \
            -e NAPI_RUST_VERSION -e NAPI_NODE_VERSION -e NAPI_RUSTUP_TOOLCHAIN \
            -e "RUSTUP_TOOLCHAIN=$NAPI_RUSTUP_TOOLCHAIN" \
            "$NAPI_MANYLINUX_IMAGE" \
            sh -ceu '
              node --version | grep -F "v$NAPI_NODE_VERSION"
              rustc --version | grep -F "rustc $NAPI_RUST_VERSION"
              test "$RUSTUP_TOOLCHAIN" = "$NAPI_RUSTUP_TOOLCHAIN"
              test ! -w /opt/fathomdb/rustup
              npm ci && npm run build:native
            '
      - name: Assert glibc floor (AC80-1)
        if: ${{ matrix.label == 'linux-arm64-gnu' }}
        run: |
          . scripts/release/glibc-floor-contract.sh
          bash scripts/check-glibc-floor.sh --floor "$GLIBC_FLOOR" "src/ts/fathomdb.${{ matrix.label }}.node"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-${{ matrix.label }}
          path: src/ts/fathomdb.${{ matrix.label }}.node

  # Slice 20: retain and smoke the sole Linux x64 CUDA package bytes. This is
  # a dry-run-only candidate route. It cannot grant a tag or a publication
  # path the unmerged-candidate exception; a later canonical tag route needs
  # separately reviewed provenance and must independently consume this format.
  cuda-package-rehearsal:
    needs: [verify-release, verify-cuda-trusted-route, cuda-contract-preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda-12]
    environment: cuda-unmerged-preflight
    env:
      FATHOMDB_CUDA_GPU_UUID: ${{ vars.FATHOMDB_CUDA_GPU_UUID }}
      CUDA_HOME: /usr/local/cuda-12.6
      CUDA_PATH: /usr/local/cuda-12.6
      LIBRARY_PATH: /usr/local/cuda-12.6/targets/x86_64-linux/lib
      CUDARC_CUDA_VERSION: "12060"
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, main-owned control plane only
        with:
          ref: ${{ github.workflow_sha }}
          path: control-plane
          persist-credentials: false
      - name: Download same-run unmerged route receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-unmerged-route-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-plane/receipt
      - name: Download same-run CUDA preflight witness and package bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-preflight-witness
          path: preflight-witness
      - name: Download same-run CUDA preflight package bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-preflight-packages
          path: preflight-packages
      - name: Verify same-run receipt and preflight witness before candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 control-plane/scripts/release/verify-cuda-unmerged-receipt.py \
            --receipt control-plane/receipt/cuda-unmerged-route-receipt.json \
            --manifest control-plane/dev/release/cuda-unmerged-candidates.json \
            --candidate-sha '${{ inputs.candidate_commit }}' \
            --workflow-ref '${{ github.workflow_ref }}' \
            --workflow-sha '${{ github.workflow_sha }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}'
          python3 control-plane/scripts/release/verify-cuda-preflight-witness.py \
            --witness-dir preflight-witness \
            --candidate-sha '${{ inputs.candidate_commit }}'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, receipt and witness verified
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-gnu
      - name: Build canonical CUDA package input identity
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo_versions="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; p=json.load(sys.stdin)["packages"]; print(" ".join(x["version"] for x in p if x["name"] in {"fathomdb-py","fathomdb-cli"}))')"
          npm_version="$(python3 -c 'import json; print(json.load(open("src/ts/package.json"))["version"])')"
          napi_version="$(python3 -c 'import json; print(json.load(open("src/ts/npm/linux-x64-gnu/package.json"))["version"])')"
          version="$npm_version"
          test "$cargo_versions" = "$version $version" && test "$version" = "$npm_version" && test "$version" = "$napi_version"
          cargo build --locked --release -p fathomdb-cli --features embed-cuda --target x86_64-unknown-linux-gnu
          archive="fathomdb-$version-x86_64-unknown-linux-gnu.tar.gz"
          bash ../control-plane/scripts/release/seal-cuda-cli-archive.sh \
            --binary target/x86_64-unknown-linux-gnu/release/fathomdb \
            --version "$version" --output "$archive"
          python3 - '${{ inputs.candidate_commit }}' "$version" "$archive" '../preflight-witness/model-cache-manifest.json' > cuda-package-build-input.json <<'PY'
          import hashlib
          import json
          import sys
          candidate, version, archive, model_manifest = sys.argv[1:]
          print(json.dumps({
              "schema_version": "fathomdb.cuda-package-build-input/v2",
              "candidate_sha": candidate,
              "version": version,
              "target": "x86_64-unknown-linux-gnu",
              "python_features": ["embed-cuda", "pyo3/extension-module"],
              "napi_features": ["default-embedder", "embed-cuda"],
              "cli_features": ["embed-cuda"],
              "rerank_cuda": False,
              "model_cache_manifest_sha256": hashlib.sha256(open(model_manifest, "rb").read()).hexdigest(),
              "archive_filename": archive,
          }, ensure_ascii=True, separators=(",", ":"), sort_keys=True))
          PY
      - name: Smoke installed retained package bytes in isolated containers
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find ../preflight-packages -maxdepth 1 -type f -name 'fathomdb-*.whl' -print -quit)"
          npm_main="$(find ../preflight-packages -maxdepth 1 -type f -name 'fathomdb-*.tgz' ! -name '*linux-x64-gnu*' -print -quit)"
          napi_platform="$(find ../preflight-packages -maxdepth 1 -type f -name 'fathomdb-linux-x64-gnu-*.tgz' -print -quit)"
          cli_archive="$(find . -maxdepth 1 -type f -name 'fathomdb-*-x86_64-unknown-linux-gnu.tar.gz' -print -quit)"
          test -n "$wheel" && test -n "$npm_main" && test -n "$napi_platform" && test -n "$cli_archive"
          bash ../control-plane/scripts/release/cuda-package-rehearsal-smoke.sh \
            --python-wheel "$wheel" \
            --npm-main "$npm_main" \
            --napi-platform "$napi_platform" \
            --cli-archive "$cli_archive" \
            --model-cache-manifest ../preflight-witness/model-cache-manifest.json \
            --hf-home "${FATHOMDB_CUDA_PREFLIGHT_HF_HOME:-${HF_HOME:-$HOME/.cache/huggingface}}" \
            --smoke-dir cuda-package-smoke
      - name: Seal exact non-publishing CUDA package rehearsal bundle
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find preflight-packages -maxdepth 1 -type f -name 'fathomdb-*.whl' -print -quit)"
          npm_main="$(find preflight-packages -maxdepth 1 -type f -name 'fathomdb-*.tgz' ! -name '*linux-x64-gnu*' -print -quit)"
          napi_platform="$(find preflight-packages -maxdepth 1 -type f -name 'fathomdb-linux-x64-gnu-*.tgz' -print -quit)"
          cli_archive="$(find candidate -maxdepth 1 -type f -name 'fathomdb-*-x86_64-unknown-linux-gnu.tar.gz' -print -quit)"
          bash control-plane/scripts/release/cuda-package-rehearsal.sh \
            --candidate-sha '${{ inputs.candidate_commit }}' \
            --route-receipt control-plane/receipt/cuda-unmerged-route-receipt.json \
            --route-manifest control-plane/dev/release/cuda-unmerged-candidates.json \
            --preflight-witness-dir preflight-witness \
            --build-input candidate/cuda-package-build-input.json \
            --python-wheel "$wheel" \
            --npm-main "$npm_main" \
            --napi-platform "$napi_platform" \
            --cli-archive "$cli_archive" \
            --smoke-dir candidate/cuda-package-smoke \
            --output-dir candidate/cuda-package-rehearsal \
            --workflow-ref '${{ github.workflow_ref }}' \
            --workflow-sha '${{ github.workflow_sha }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}'
      - name: Upload verified package rehearsal bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-package-rehearsal
          path: candidate/cuda-package-rehearsal
          if-no-files-found: error

  # Slice 71: candidate-only reranker CUDA v3 rehearsal. It consumes only the
  # separately-built v3 Python/N-API bytes and emits no publication credentials.
  cuda-reranker-package-rehearsal:
    needs: [verify-release, verify-cuda-trusted-route, cuda-contract-preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda-12]
    environment: cuda-unmerged-preflight
    env:
      FATHOMDB_CUDA_GPU_UUID: ${{ vars.FATHOMDB_CUDA_GPU_UUID }}
      CUDA_HOME: /usr/local/cuda-12.6
      CUDA_PATH: /usr/local/cuda-12.6
      LIBRARY_PATH: /usr/local/cuda-12.6/targets/x86_64-linux/lib
      CUDARC_CUDA_VERSION: "12060"
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, control plane
        with:
          ref: ${{ github.workflow_sha }}
          path: control-plane
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-unmerged-route-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-plane/receipt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-rerank-preflight-witness
          path: rerank-preflight-witness
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cuda-rerank-preflight-packages
          path: rerank-preflight-packages
      - name: Verify candidate binding and v3 witness
        shell: bash
        run: |
          set -euo pipefail
          python3 control-plane/scripts/release/verify-cuda-unmerged-receipt.py \
            --receipt control-plane/receipt/cuda-unmerged-route-receipt.json \
            --manifest control-plane/dev/release/cuda-unmerged-candidates.json \
            --candidate-sha '${{ inputs.candidate_commit }}' \
            --workflow-ref '${{ github.workflow_ref }}' --workflow-sha '${{ github.workflow_sha }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'
          python3 control-plane/scripts/release/verify-cuda-preflight-witness.py \
            --witness-dir rerank-preflight-witness --candidate-sha '${{ inputs.candidate_commit }}'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, verified candidate
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-gnu
      - name: Build and seal reranker CUDA CLI candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("src/ts/package.json"))["version"])')"
          cargo build --locked --release -p fathomdb-cli --features embed-cuda,rerank-cuda --target x86_64-unknown-linux-gnu
          bash ../control-plane/scripts/release/seal-cuda-cli-archive.sh \
            --binary target/x86_64-unknown-linux-gnu/release/fathomdb --version "$version" \
            --output "fathomdb-$version-x86_64-unknown-linux-gnu.tar.gz"
          python3 - '${{ inputs.candidate_commit }}' "$version" '../rerank-preflight-witness/model-cache-manifest.json' > cuda-rerank-package-build-input.json <<'PY'
          import hashlib, json, sys
          candidate, version, manifest = sys.argv[1:]
          print(json.dumps({"schema_version":"fathomdb.cuda-package-build-input/v3","candidate_sha":candidate,"version":version,"target":"x86_64-unknown-linux-gnu","python_features":["embed-cuda","rerank-cuda","pyo3/extension-module"],"napi_features":["default-embedder","embed-cuda","rerank-cuda"],"cli_features":["embed-cuda","rerank-cuda"],"rerank_cuda":True,"model_cache_manifest_sha256":hashlib.sha256(open(manifest,"rb").read()).hexdigest(),"archive_filename":f"fathomdb-{version}-x86_64-unknown-linux-gnu.tar.gz"}, ensure_ascii=True,separators=(",",":"),sort_keys=True))
          PY
      - name: Smoke and seal candidate-only reranker v3 rehearsal
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find rerank-preflight-packages -name 'fathomdb-*.whl' -print -quit)"
          npm_main="$(find rerank-preflight-packages -name 'fathomdb-*.tgz' ! -name '*linux-x64-gnu*' -print -quit)"
          napi_platform="$(find rerank-preflight-packages -name 'fathomdb-linux-x64-gnu-*.tgz' -print -quit)"
          cli_archive="$(find candidate -maxdepth 1 -name 'fathomdb-*-x86_64-unknown-linux-gnu.tar.gz' -print -quit)"
          test -n "$wheel" && test -n "$npm_main" && test -n "$napi_platform" && test -n "$cli_archive"
          bash control-plane/scripts/release/cuda-package-rehearsal-smoke.sh --python-wheel "$wheel" --npm-main "$npm_main" --napi-platform "$napi_platform" --cli-archive "$cli_archive" --model-cache-manifest rerank-preflight-witness/model-cache-manifest.json --reranker-cache-manifest rerank-preflight-witness/reranker-cache-manifest.json --hf-home "${FATHOMDB_CUDA_PREFLIGHT_HF_HOME:-${HF_HOME:-$HOME/.cache/huggingface}}" --smoke-dir candidate/cuda-rerank-package-smoke
          bash control-plane/scripts/release/cuda-package-rehearsal.sh --candidate-sha '${{ inputs.candidate_commit }}' --route-receipt control-plane/receipt/cuda-unmerged-route-receipt.json --route-manifest control-plane/dev/release/cuda-unmerged-candidates.json --preflight-witness-dir rerank-preflight-witness --build-input candidate/cuda-rerank-package-build-input.json --python-wheel "$wheel" --npm-main "$npm_main" --napi-platform "$napi_platform" --cli-archive "$cli_archive" --smoke-dir candidate/cuda-rerank-package-smoke --output-dir candidate/cuda-rerank-package-rehearsal --workflow-ref '${{ github.workflow_ref }}' --workflow-sha '${{ github.workflow_sha }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-rerank-package-rehearsal
          path: candidate/cuda-rerank-package-rehearsal
          if-no-files-found: error

  # Pre-publish packaging verification for Rust crates:
  #   1. cargo build --release --workspace — compile check of every crate
  #      we are about to publish.
  #   2. cargo package --no-verify for the three leaf crates with no
  #      in-workspace dependencies (fathomdb-embedder-api, fathomdb-schema,
  #      fathomdb-query). Validates manifest/readme/license metadata
  #      without invoking the registry.
  #
  # The dependent crates (fathomdb-engine, fathomdb-embedder, fathomdb,
  # fathomdb-cli) are NOT packaged here: cargo package rewrites path deps
  # to versioned deps and then does a registry resolve on the rewritten
  # manifest. For a fresh release the leaf crates are not published yet,
  # so the resolve cannot find e.g. fathomdb-schema@0.6.0 and fails.
  # Manifest correctness of the dependent crates is enforced at actual
  # publish time inside `cargo publish`, which we do not want to duplicate
  # at CI cost.
  build-rust:
    runs-on: ubuntu-latest
    needs: [verify-release, verify-cuda-trusted-route]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Verify workspace builds in release mode
        run: cargo build --release --workspace
      - name: Package fathomdb-embedder-api (leaf, Axis E)
        run: cargo package --no-verify -p fathomdb-embedder-api
      - name: Package fathomdb-schema (leaf, no in-workspace deps)
        run: cargo package --no-verify -p fathomdb-schema
      - name: Package fathomdb-query (leaf, no in-workspace deps)
        run: cargo package --no-verify -p fathomdb-query

  # The normal Linux x64 Python wheel and npm platform package are built with
  # CUDA. Their package names stay unchanged; the existing publishers consume
  # these artifact names alongside the CPU-only platform artifacts.
  build-cuda-linux-x64-gnu:
    needs: [verify-release, verify-cuda-trusted-route]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda-12]
    environment: cuda-unmerged-preflight
    env:
      FATHOMDB_CUDA_GPU_UUID: ${{ vars.FATHOMDB_CUDA_GPU_UUID }}
      CUDA_HOME: /usr/local/cuda-12.6
      CUDA_PATH: /usr/local/cuda-12.6
      LIBRARY_PATH: /usr/local/cuda-12.6/targets/x86_64-linux/lib
      CUDARC_CUDA_VERSION: "12060"
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Install N-API build dependencies
        working-directory: src/ts
        run: npm ci
      - name: Build and prove canonical CUDA package bytes
        run: bash scripts/release/cuda-preflight.sh "${{ github.workspace }}/cuda-canonical-preflight-witness" --rerank-cuda
      - name: Stage normal-name publisher artifacts
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${{ github.workspace }}/cuda-canonical-preflight-witness.packages"
          wheel=("$package_dir"/fathomdb-*.whl)
          napi=("$package_dir"/fathomdb-linux-x64-gnu-*.tgz)
          test "${#wheel[@]}" = 1
          test "${#napi[@]}" = 1
          mkdir -p cuda-canonical-artifacts/python cuda-canonical-artifacts/napi
          cp "${wheel[0]}" cuda-canonical-artifacts/python/
          tar -xzf "${napi[0]}" --strip-components=1 -C cuda-canonical-artifacts/napi
          node_binary=(cuda-canonical-artifacts/napi/fathomdb.linux-x64-gnu.node)
          test "${#node_binary[@]}" = 1
          test -s "${node_binary[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-x86_64-unknown-linux-gnu
          path: cuda-canonical-artifacts/python/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-linux-x64-gnu
          path: cuda-canonical-artifacts/napi/fathomdb.linux-x64-gnu.node
          if-no-files-found: error

  # Cross-ecosystem gate: every build must succeed before ANY publish runs.
  # Without this, a partial release (e.g. crates.io 0.6.0 published but
  # pypi 0.6.0 blocked on a build failure) leaves downstream versioning
  # unrecoverable — 0.6.1 would then have mismatched ecosystem coverage.
  all-builds-passed:
    runs-on: ubuntu-latest
    # Normal releases require every artifact build. The explicit v0.8.20
    # recovery dispatch omits only N-API, whose npm artifact is intentionally
    # not being recovered; verify, Python, and Rust remain hard gates.
    if: ${{ always() && needs.verify-release.result == 'success' && needs.build-python.result == 'success' && needs.build-rust.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.dry_run == true && needs.cuda-package-rehearsal.result == 'success') || ((github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && needs.build-cuda-linux-x64-gnu.result == 'success')) && ((github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') || needs.build-napi.result == 'success') }}
    needs:
      - verify-release
      - build-python
      - build-napi
      - build-rust
      - cuda-package-rehearsal
      - build-cuda-linux-x64-gnu
    steps:
      - run: echo "all release build gates passed"

  # --- Tiered cargo publish (T1..T7) -----------------------------------------
  # Each tier publishes one crate, then sleeps 60s to let the crates.io
  # index propagate before the next tier resolves the dep against it.
  # --locked is omitted: the lock file is generated against local path
  # dependencies, which do not match the crates.io index state during
  # tiered publishing.
  # Order rationale: see dev/design/release.md § Tiered publish order.
  #
  # Idempotency: every tier delegates to scripts/release/cargo-publish-if-new.sh,
  # which checks crates.io for the target version and skips the publish
  # (exit 0) if it already exists. This covers axis-W-only patch releases
  # (axis-E held at a prior version) and partial-republish retries.

  publish-rust-t1-embedder-api:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.all-builds-passed.result == 'success' }}
    needs: all-builds-passed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb-embedder-api
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb-embedder-api
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb-embedder-api
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb-embedder-api

  publish-rust-t2-schema:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t1-embedder-api.result == 'success' }}
    needs: publish-rust-t1-embedder-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb-schema
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb-schema
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb-schema
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb-schema

  publish-rust-t3-query:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t2-schema.result == 'success' }}
    needs: publish-rust-t2-schema
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb-query
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb-query
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb-query
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb-query

  # T4 publishes fathomdb-embedder BEFORE fathomdb-engine: engine has a normal
  # dependency on `fathomdb-embedder = "^<axis-W>"`, so embedder must resolve on
  # the crates.io index first. (Earlier this pair was swapped — engine at T4,
  # embedder at T5 — which made engine's publish fail to resolve embedder. Fixed
  # 0.7.2 PR-4.) Dep graph: embedder needs embedder-api (T1); engine needs
  # embedder (T4) + query (T3) + schema (T2) + embedder-api (T1).
  publish-rust-t4-embedder:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t3-query.result == 'success' }}
    needs: publish-rust-t3-query
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb-embedder
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb-embedder
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb-embedder
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb-embedder

  publish-rust-t5-engine:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t4-embedder.result == 'success' }}
    needs: publish-rust-t4-embedder
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb-engine
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb-engine
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb-engine
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb-engine

  publish-rust-t6-facade:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t5-engine.result == 'success' }}
    needs: publish-rust-t5-engine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb (facade)
        # facade depends on fathomdb-engine (now T5).
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb

  publish-rust-t7-cli:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t6-facade.result == 'success' }}
    needs: publish-rust-t6-facade
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
      - name: Authenticate with crates.io
        id: crates_io_auth
        if: ${{ inputs.dry_run != true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish fathomdb-cli
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash scripts/release/cargo-publish-if-new.sh --dry-run fathomdb-cli
          else
            bash scripts/release/cargo-publish-if-new.sh fathomdb-cli
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Wait for crates.io index propagation (poll, not sleep)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/release/wait-for-crate-version.sh fathomdb-cli

  # --- Tier 8: binding-package parallel publishes ----------------------------
  # PyPI + npm wrap fathomdb-engine directly (PyO3 / napi-rs). They publish
  # in parallel after T5 (engine) resolves on crates.io — independent of
  # T6..T7.

  publish-pypi:
    runs-on: ubuntu-latest
    # TestPyPI also rejects same-version re-uploads — dry-run rehearsals would
    # consume the next-release version slot. Skip the publish step entirely
    # on dispatch; the build-python matrix still runs on dry-run so wheel
    # buildability stays exercised across platforms.
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t5-engine.result == 'success' }}
    needs: publish-rust-t5-engine
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          # R-REL-4c — per-registry idempotency. PyPI rejects a re-upload of an
          # already-present file (HTTP 400); skip-existing makes a partial-
          # release retry / the 0.8.20 OPP-12 breaking-pair re-run no-op per
          # file instead of failing hard. scripts/release/pypi-publish-if-new.sh
          # is the locally-exercisable equivalent (idempotency test).
          skip-existing: true

  # --- Tier 8: npm per-platform binary package (R-REL-4f) --------------------
  # Publishes the Linux x64 platform binary package. It carries os/cpu so npm
  # installs it only on matching hosts, and is wired as an optionalDependency
  # of the thin main `fathomdb` package alongside the Linux AArch64 package.
  # Idempotent (npm-publish-if-new.sh) + non-latest dist-tag (NPM_DIST_TAG).
  # Published BEFORE the main package so the optionalDependency resolves.
  publish-npm-platform-linux-x64-gnu:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.all-builds-passed.result == 'success' }}
    needs: all-builds-passed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      # Stage the compiled binary into the platform package directory; its
      # package.json (os/cpu/libc + main) is committed, the .node is not.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-linux-x64-gnu
          path: src/ts/npm/linux-x64-gnu
      - name: List staged platform package
        working-directory: src/ts/npm/linux-x64-gnu
        run: ls -la
      # npm OIDC trusted publishing needs npm >= 11.5.1; the exact Node
      # 25.9.0 toolchain supplies npm 11.12.1 for the publisher. --access
      # --access public keeps the platform package public; --provenance attests
      # the build. Idempotent no-op
      # if this version is already on the registry.
      - name: Publish fathomdb-linux-x64-gnu
        working-directory: src/ts/npm/linux-x64-gnu
        env:
          NPM_BIN: "npm"
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" \
              --dry-run --tag "${NPM_DIST_TAG}" -- --access public --provenance
          else
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" \
              --tag "${NPM_DIST_TAG}" -- --access public --provenance
          fi

  # Linux AArch64 counterpart of the x64 platform package. It is published
  # before the main package so publish-time optionalDependency injection makes
  # the matching binary available to Linux ARM64 npm installs.
  publish-npm-platform-linux-arm64-gnu:
    runs-on: ubuntu-24.04-arm
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.all-builds-passed.result == 'success' }}
    needs: all-builds-passed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-linux-arm64-gnu
          path: src/ts/npm/linux-arm64-gnu
      - name: List staged platform package
        working-directory: src/ts/npm/linux-arm64-gnu
        run: ls -la
      - name: Publish fathomdb-linux-arm64-gnu
        working-directory: src/ts/npm/linux-arm64-gnu
        env:
          NPM_BIN: "npm"
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" \
              --dry-run --tag "${NPM_DIST_TAG}" -- --access public --provenance
          else
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" \
              --tag "${NPM_DIST_TAG}" -- --access public --provenance
          fi

  # Platform packages must all publish before the thin main package injects
  # their exact optionalDependency versions. Trusted publishing is configured
  # manually in npm for each new package; these jobs use GitHub OIDC only.
  publish-npm-platform-darwin-x64:
    runs-on: macos-15-intel
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.all-builds-passed.result == 'success' }}
    needs: all-builds-passed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-darwin-x64
          path: src/ts/npm/darwin-x64
      - name: Publish fathomdb-darwin-x64
        working-directory: src/ts/npm/darwin-x64
        env:
          NPM_BIN: "npm"
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" --dry-run --tag "${NPM_DIST_TAG}" -- --access public --provenance
          else
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" --tag "${NPM_DIST_TAG}" -- --access public --provenance
          fi

  publish-npm-platform-darwin-arm64:
    runs-on: macos-14
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.all-builds-passed.result == 'success' }}
    needs: all-builds-passed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-darwin-arm64
          path: src/ts/npm/darwin-arm64
      - name: Publish fathomdb-darwin-arm64
        working-directory: src/ts/npm/darwin-arm64
        env:
          NPM_BIN: "npm"
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" --dry-run --tag "${NPM_DIST_TAG}" -- --access public --provenance
          else
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" --tag "${NPM_DIST_TAG}" -- --access public --provenance
          fi

  publish-npm-platform-win32-x64-msvc:
    runs-on: windows-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.all-builds-passed.result == 'success' }}
    needs: all-builds-passed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-win32-x64-msvc
          path: src/ts/npm/win32-x64-msvc
      - name: Publish fathomdb-native-win32-x64-msvc
        shell: bash
        working-directory: src/ts/npm/win32-x64-msvc
        env:
          NPM_BIN: "npm"
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" --dry-run --tag "${NPM_DIST_TAG}" -- --access public --provenance
          else
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" --tag "${NPM_DIST_TAG}" -- --access public --provenance
          fi

  # Thin main `fathomdb` package: ships dist/ only (NO .node — the platform
  # packages carry the binaries as optionalDependencies). Idempotent publish
  # under the staged `next` dist-tag until all registry smokes permit only the
  # main package's promotion to `latest`.
  publish-npm:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.publish-rust-t5-engine.result == 'success' && needs.publish-npm-platform-linux-x64-gnu.result == 'success' && needs.publish-npm-platform-linux-arm64-gnu.result == 'success' && needs.publish-npm-platform-darwin-x64.result == 'success' && needs.publish-npm-platform-darwin-arm64.result == 'success' && needs.publish-npm-platform-win32-x64-msvc.result == 'success' }}
    needs:
      - publish-rust-t5-engine
      - publish-npm-platform-linux-x64-gnu
      - publish-npm-platform-linux-arm64-gnu
      - publish-npm-platform-darwin-x64
      - publish-npm-platform-darwin-arm64
      - publish-npm-platform-win32-x64-msvc
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: src/ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      - name: Install + build TypeScript
        run: |
          npm ci
          npx tsc -p tsconfig.build.json
      # R-REL-4f — inject optionalDependencies (one per published platform
      # package under src/ts/npm/<triple>/) into package.json just before
      # publish, so the committed package.json stays npm-ci-clean while the
      # PUBLISHED package carries the per-platform binary contract.
      - name: Inject per-platform optionalDependencies
        working-directory: ${{ github.workspace }}
        run: bash scripts/release/npm-inject-optional-deps.sh
      - name: Publish main package to npm (or dry-run rehearsal)
        env:
          NPM_BIN: "npm"
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" \
              --dry-run --tag "${NPM_DIST_TAG}" -- --access public --provenance
          else
            bash "$GITHUB_WORKSPACE/scripts/release/npm-publish-if-new.sh" \
              --tag "${NPM_DIST_TAG}" -- --access public --provenance
          fi

  # --- Post-publish verification --------------------------------------------
  # AC-056: a published artifact is not "done" until it installs cleanly from
  # the registry on a fresh machine and the SDK opens + closes + process-exits.
  # Skipped on dry-run — install-from-test.pypi does not mirror prod closely
  # enough to make the smoke meaningful, and npm has no comparable staging.
  post-publish-smoke:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') || needs.publish-npm.result == 'success') }}
    needs:
      - publish-rust-t7-cli
      - publish-pypi
      - publish-npm
    strategy:
      fail-fast: false
      matrix:
        smoke: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && '["crates-cli","pypi-wheel"]' || '["crates-cli","pypi-wheel","npm-package"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.smoke == 'pypi-wheel'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.smoke == 'npm-package'
        with:
          node-version: "25.9.0"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        if: matrix.smoke == 'crates-cli'
        with:
          toolchain: "1.95.0"
      - name: Resolve tag version
        id: ver
        run: |
          v="${RELEASE_TAG#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Run smoke
        run: bash "scripts/release/smoke/smoke-${{ matrix.smoke }}.sh" "${{ steps.ver.outputs.version }}"

  # Registry smokes must execute on the architecture served by the newly
  # published wheel and optional npm platform package, not only on x86_64.
  post-publish-smoke-aarch64:
    runs-on: ubuntu-24.04-arm
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' }}
    needs:
      - publish-rust-t7-cli
      - publish-pypi
      - publish-npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
      - name: Resolve tag version
        id: ver
        run: |
          v="${RELEASE_TAG#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Smoke AArch64 Python wheel
        run: bash scripts/release/smoke/smoke-pypi-wheel.sh "${{ steps.ver.outputs.version }}"
      - name: Smoke AArch64 npm package
        run: bash scripts/release/smoke/smoke-npm-package.sh "${{ steps.ver.outputs.version }}"

  post-publish-smoke-darwin-x64:
    runs-on: macos-15-intel
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' }}
    needs: [publish-rust-t7-cli, publish-pypi, publish-npm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
      - id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - run: bash scripts/release/smoke/smoke-pypi-wheel.sh "${{ steps.ver.outputs.version }}"
      - run: bash scripts/release/smoke/smoke-npm-package.sh "${{ steps.ver.outputs.version }}"

  post-publish-smoke-darwin-arm64:
    runs-on: macos-14
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' }}
    needs: [publish-rust-t7-cli, publish-pypi, publish-npm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
      - id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - run: bash scripts/release/smoke/smoke-pypi-wheel.sh "${{ steps.ver.outputs.version }}"
      - run: bash scripts/release/smoke/smoke-npm-package.sh "${{ steps.ver.outputs.version }}"

  post-publish-smoke-win32-x64:
    runs-on: windows-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' }}
    needs: [publish-rust-t7-cli, publish-pypi, publish-npm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, candidate SHA or canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
      - id: ver
        shell: pwsh
        run: '"version=$($env:RELEASE_TAG.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'
      - shell: pwsh
        run: ./scripts/release/smoke/smoke-pypi-wheel.ps1 "${{ steps.ver.outputs.version }}"
      - shell: pwsh
        run: ./scripts/release/smoke/smoke-npm-package.ps1 "${{ steps.ver.outputs.version }}"

  # AC-052: sibling triple (fathomdb + fathomdb-embedder + fathomdb-embedder-
  # api) must all exist in the registry at the expected versions after the
  # tier 1..7 publishes complete. Skipped on dry-run since no real publish
  # happened.
  co-tagging-assert:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' }}
    needs:
      - publish-rust-t7-cli
      - publish-pypi
      - publish-npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, canonical release tag
        with:
          ref: ${{ env.RELEASE_CHECKOUT_REF }}
      - name: Resolve tag version
        id: ver
        run: |
          v="${RELEASE_TAG#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Assert sibling-package co-tagging
        run: bash scripts/release/assert-co-tagging.sh "${{ steps.ver.outputs.version }}"

  # Every native registry smoke must be green before the *main* package moves
  # from next to latest. Platform packages intentionally remain on next: users
  # resolve them through the version-pinned optionalDependencies of fathomdb.
  promote-npm-latest:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.post-publish-smoke.result == 'success' && needs.post-publish-smoke-aarch64.result == 'success' && needs.post-publish-smoke-darwin-x64.result == 'success' && needs.post-publish-smoke-darwin-arm64.result == 'success' && needs.post-publish-smoke-win32-x64.result == 'success' && needs.co-tagging-assert.result == 'success' }}
    needs:
      - post-publish-smoke
      - post-publish-smoke-aarch64
      - post-publish-smoke-darwin-x64
      - post-publish-smoke-darwin-arm64
      - post-publish-smoke-win32-x64
      - co-tagging-assert
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
          registry-url: "https://registry.npmjs.org"
      - name: Promote only the main fathomdb package to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "fathomdb@${RELEASE_TAG#v}" latest

  # AC-054 partial: only this job marks the release complete by creating the
  # GitHub Release. If any smoke or co-tagging job is red, this job does not
  # run, so the release is never marked done. Skipped on dry-run.
  github-release:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && inputs.dry_run != true && !(github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20') && needs.promote-npm-latest.result == 'success' }}
    needs:
      - promote-npm-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  # v0.8.20 registry recovery deliberately leaves npm unpublished. This job
  # is the durable workflow-visible record that crates.io and PyPI recovered
  # from the immutable tag while npm and release finalization remain pending.
  record-v0820-partial-registry-recovery:
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.candidate_commit == '' && github.event_name == 'workflow_dispatch' && inputs.recovery_skip_npm == true && inputs.release_version == '0.8.20' && needs.publish-rust-t7-cli.result == 'success' && needs.publish-pypi.result == 'success' && needs.post-publish-smoke.result == 'success' }}
    needs:
      - publish-rust-t7-cli
      - publish-pypi
      - post-publish-smoke
    steps:
      - name: Record v0.8.20 partial registry recovery
        run: |
          {
            echo "## v0.8.20 partial registry recovery"
            echo
            echo "- crates.io and PyPI publication completed from ${RELEASE_TAG}."
            echo "- npm publishing, npm smoke, co-tagging, and GitHub Release creation were intentionally skipped."
            echo "- The release remains partial until npm has a separately approved recovery path."
          } >> "$GITHUB_STEP_SUMMARY"
