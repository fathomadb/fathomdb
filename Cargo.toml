[workspace]
members = [
    "src/rust/crates/fathomdb",
    "src/rust/crates/fathomdb-cli",
    "src/rust/crates/fathomdb-embedder",
    "src/rust/crates/fathomdb-embedder-api",
    "src/rust/crates/fathomdb-engine",
    "src/rust/crates/fathomdb-napi",
    "src/rust/crates/fathomdb-py",
    "src/rust/crates/fathomdb-query",
    "src/rust/crates/fathomdb-schema",
    "src/rust/crates/fathomdb-tc5-benchmark",
]
resolver = "2"

[workspace.package]
# Axis W lockstep version per dev/design/release.md § Version axes.
# Inherited by every workspace crate via `version.workspace = true` EXCEPT
# `fathomdb-embedder-api`, which opts out and carries an independent
# Axis E version in its own `[package]` block (semver-stable trait
# surface — bumps only when the trait changes).
#
# Axis E note: axis-E (`fathomdb-embedder-api`) was held on axis-W
# lockstep through the 0.6.0 RC bootstrap (rc.1) and the GA cut so a
# single sentinel-publish established registry presence for all 7 crates
# plus embedder-api at `0.6.0`. Post-GA, axis-E is independent —
# embedder-api bumps on its own cadence when the trait surface changes,
# decoupled from axis-W bumps.
version = "0.8.26"
edition = "2021"
# 0.8.20 Slice 39 (R-20-DOC, HITL seq-193): the project is MIT. The repo-root
# `LICENSE` is authoritative; this SPDX field and every other publishable
# manifest must agree with it (asserted by scripts/check-license-consistency.sh).
license = "MIT"
# Cargo warns when both `license` and `license-file` are present. MIT has a
# standard SPDX expression, so publishable crates inherit this field alone and
# carry a byte-identical, regular LICENSE at their own package root. Cargo
# includes that conventional file in each `.crate`; the consistency gate proves
# both the source copies and real `cargo package --list` output.
repository = "https://github.com/fathomadb/fathomdb"
rust-version = "1.95"

[workspace.metadata.fathomdb]
public_docs = ["docs"]
internal_docs = ["dev"]

# In-workspace sibling crate dependencies. `cargo publish` requires every
# dep to carry a `version` requirement so the registry resolver can find
# them once `path` is stripped at publish time. Centralizing the version
# pins here keeps the release substrate (`scripts/set-version.sh`) editing
# one location per axis, not N call-sites.
#
# Axis W entries are bumped lockstep with [workspace.package].version.
# Axis E (fathomdb-embedder-api) carries its independent version per
# dev/design/release.md § Version axes.
[workspace.dependencies]
fathomdb              = { path = "src/rust/crates/fathomdb",              version = "0.8.26" }
fathomdb-embedder     = { path = "src/rust/crates/fathomdb-embedder",     version = "0.8.26" }
fathomdb-embedder-api = { path = "src/rust/crates/fathomdb-embedder-api", version = "0.6.1" }
fathomdb-engine       = { path = "src/rust/crates/fathomdb-engine",       version = "0.8.26" }
fathomdb-query        = { path = "src/rust/crates/fathomdb-query",        version = "0.8.26" }
fathomdb-schema       = { path = "src/rust/crates/fathomdb-schema",       version = "0.8.26" }

# Every entry here is governed by scripts/check-pinned-override-rot.py, which
# authenticates its exact source; see scripts/pinned-override-rot.json.
#
# libsqlite3-sys: published 0.38.1 with the SQLite 3.53.3 Windows WAL path
# backport (third_party/libsqlite3-sys-0.38.1/FATHOMDB-PATCH.md).
#
# cudarc: published 0.19.7, the version Candle resolves, vendored so the
# CUDA allocator can fall back to synchronous allocation when the device's
# default memory pool is unavailable (third_party/cudarc-0.19.7/FATHOMDB-PATCH.md).
# Only 0.19.7 is patched; ug-cuda's cudarc 0.17.8 stays on crates.io.
#
# Fathom-maintained Candle 0.10.2 preserves the Linux AArch64 CPU Gemm/F16
# fallback. Pin core, nn, transformers, and candle-kernels together: the
# kernel crate owns the CUDART link boundary and must resolve from this exact
# reviewed revision rather than crates.io. CUDA driver discovery remains
# dynamic, while the kernel runtime is statically linked so a CPU-mode binding
# can map on a host without libcudart.
#
# Root patches apply to workspace builds only; they do not propagate to
# downstream users of the published Rust crates.
[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys-0.38.1" }
cudarc = { path = "third_party/cudarc-0.19.7" }
candle-core-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
candle-kernels = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
candle-nn-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
candle-transformers-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
