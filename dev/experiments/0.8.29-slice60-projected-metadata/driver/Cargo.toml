[package]
name = "s60-manual-metadata-acceptance"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
cuda-producer = ["fathomdb-sdk/embed-cuda"]

[dependencies]
fathomdb-sdk = { path = "../../../../src/rust/crates/fathomdb-sdk", default-features = false }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }

[patch.crates-io]
candle-kernels = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "182ceab0547348993b6dbec4b1aed610dcc8b23f" }
