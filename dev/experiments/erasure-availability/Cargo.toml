[package]
name = "erasure-availability"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
fathomdb-engine = { path = "../../../src/rust/crates/fathomdb-engine", features = ["test-hooks", "operator"] }
fathomdb-embedder-api = { path = "../../../src/rust/crates/fathomdb-embedder-api" }
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[dev-dependencies]
proptest = "1"

[features]
phase2-metrics = []
