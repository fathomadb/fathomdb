[package]
name = "comp-surrealdb-driver"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
surrealdb = { version = "=3.3.0", default-features = false, features = ["kv-rocksdb", "kv-surrealkv"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
debug = false
