[package]
name = "fathomdb-sdk-benchmark-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
fathomdb-sdk = { path = "../../../src/rust/crates/fathomdb-sdk", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = []
default-embedder = ["fathomdb-sdk/default-embedder"]
embed-cuda = ["fathomdb-sdk/embed-cuda"]
embed-metal = ["fathomdb-sdk/embed-metal"]
default-reranker = ["fathomdb-sdk/default-reranker"]
rerank-cuda = ["fathomdb-sdk/rerank-cuda"]
rerank-metal = ["fathomdb-sdk/rerank-metal"]

# Standalone workspaces repeat the exact governed root cohort; source-only
# mirrors are inherited from the repository .cargo/config.toml.
[patch.crates-io]
candle-kernels-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "952edb7dcd1e29563acedd485a3c1ce8ef07a85c" }
cudarc-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/cudarc", rev = "3509cd6bd83b44204be1880e833474ab0f75e060" }
candle-core-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb", rev = "952edb7dcd1e29563acedd485a3c1ce8ef07a85c" }
candle-nn-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb", rev = "952edb7dcd1e29563acedd485a3c1ce8ef07a85c" }
candle-transformers-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb", rev = "952edb7dcd1e29563acedd485a3c1ce8ef07a85c" }

[patch."file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb"]
candle-kernels-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "952edb7dcd1e29563acedd485a3c1ce8ef07a85c" }
