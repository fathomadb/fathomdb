[package]
name = "fathomdb-sdk-benchmark-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
fathomdb-sdk = { path = "../../../src/rust/crates/fathomdb-sdk", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = []
default-embedder = ["fathomdb-sdk/default-embedder"]
embed-cuda = ["fathomdb-sdk/embed-cuda"]
embed-metal = ["fathomdb-sdk/embed-metal"]
default-reranker = ["fathomdb-sdk/default-reranker"]
rerank-cuda = ["fathomdb-sdk/rerank-cuda"]
rerank-metal = ["fathomdb-sdk/rerank-metal"]

[patch.crates-io]
libsqlite3-sys = { path = "../../../third_party/libsqlite3-sys-0.38.1" }
cudarc = { path = "../../../third_party/cudarc-0.19.7" }
candle-core-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
candle-kernels = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
candle-nn-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
candle-transformers-fathomdb = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "1aefdd008ad1c994635b688b8e6f2ae5a5a920ae" }
