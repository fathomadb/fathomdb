[package]
name = "fathomdb-sdk-benchmark-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
fathomdb-sdk = { path = "../../../src/rust/crates/fathomdb-sdk", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = []
default-embedder = ["fathomdb-sdk/default-embedder"]
embed-cuda = ["fathomdb-sdk/embed-cuda"]
embed-metal = ["fathomdb-sdk/embed-metal"]
default-reranker = ["fathomdb-sdk/default-reranker"]
rerank-cuda = ["fathomdb-sdk/rerank-cuda"]
rerank-metal = ["fathomdb-sdk/rerank-metal"]

# Standalone workspaces repeat the exact governed root cohort; source-only
# mirrors are inherited from the repository .cargo/config.toml.
[patch.crates-io]
candle-kernels = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "182ceab0547348993b6dbec4b1aed610dcc8b23f" }
cudarc-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/cudarc", rev = "343b04fa73f85ee78754d6ee2baa07b959cc9ccc" }
candle-core-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb", rev = "2ee39305a78ed1463ff913f71dcd3d45ecbfd84f" }
candle-nn-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb", rev = "2ee39305a78ed1463ff913f71dcd3d45ecbfd84f" }
candle-transformers-fathomdb = { git = "file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb", rev = "2ee39305a78ed1463ff913f71dcd3d45ecbfd84f" }

[patch."file:///home/coreyt/projects/fathomdb-forks/candle-fathomdb"]
candle-kernels = { git = "https://github.com/coreyt/candle-fathomdb.git", rev = "182ceab0547348993b6dbec4b1aed610dcc8b23f" }
