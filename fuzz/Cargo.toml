[workspace]

[package]
name = "fathomdb-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.4.2"
fathomdb-engine = { path = "../src/rust/crates/fathomdb-engine", features = ["operator", "test-hooks"] }
fathomdb-mcp = { path = "../src/rust/crates/fathomdb-mcp", features = ["test-seams"] }
fathomdb-query = { path = "../src/rust/crates/fathomdb-query" }
fathomdb-schema = { path = "../src/rust/crates/fathomdb-schema" }
libfuzzer-sys = "0.4.13"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[[bin]]
name = "fuzz_query_filter"
path = "fuzz_targets/fuzz_query_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_property_predicates"
path = "fuzz_targets/fuzz_property_predicates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_scope_policy"
path = "fuzz_targets/fuzz_scope_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_auth_tokens"
path = "fuzz_targets/fuzz_auth_tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wire_codecs"
path = "fuzz_targets/fuzz_wire_codecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mcp_jsonrpc"
path = "fuzz_targets/fuzz_mcp_jsonrpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_export_and_open_recovery"
path = "fuzz_targets/fuzz_export_and_open_recovery.rs"
test = false
doc = false
bench = false
