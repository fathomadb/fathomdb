title = "FathomDB current-tree Gitleaks policy"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Vendored SQLite extension API field names are C identifiers"
condition = "AND"
regexTarget = "match"
paths = ['''^third_party/libsqlite3-sys-0\.38\.1/(?:sqlite3|sqlcipher)/(?:sqlite3ext\.h|sqlite3\.c)$''']
regexes = ['''^sqlite3_api->(?:column_bytes16|soft_heap_limit64|hard_heap_limit64)$''']

[[rules.allowlists]]
description = "Vendored SQLite FTS5 row identifier is not a credential"
condition = "AND"
regexTarget = "match"
paths = ['''^third_party/libsqlite3-sys-0\.38\.1/(?:sqlite3|sqlcipher)/sqlite3\.c$''']
regexes = ['''^iKey==FTS5_AVERAGES_ROWID\s*$''']

[[rules.allowlists]]
description = "CUDA tokenizer digest map is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^(?:.*/)?scripts/check-cuda-release-contract\.py$''']
regexes = ['''^tokenizer\.json": "[0-9a-f]{64}"$''']

[[rules.allowlists]]
description = "Performance gauntlet tokenizer digests are artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^(?:experiments/configs/graph-retrieval-01/musique-native-expand\.v1\.json|scripts/perf-experiments/gauntlet_cells\.py|tests/experiments/test_perf_gauntlet_cells\.py|dev/performance-benchmarking/gauntlet-v1\.2/results/graph-retrieval-01-historical-300-0\.8\.26\.record\.json)$''']
regexes = ['''^tokenizer\.json": "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"$''']

[[rules.allowlists]]
description = "Slice 115 model tokenizer digest is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^dev/plans/0\.8\.27/features/slice-115/(?:protocol\.json|evidence/(?:final/(?:attempt|model-assets|protocol)\.json|invalid/attempt\.json|superseded-attempt[56]/(?:attempt|model-assets|protocol)\.json))$''']
regexes = ['''^tokenizer\.json": "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"$''']

[[rules.allowlists]]
description = "REASON-01 tokenizer digests are artifact-integrity metadata"
condition = "AND"
regexTarget = "secret"
paths = ['''^experiments/configs/reason-01/profile-registry\.v1\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "CUDA tokenizer digest export is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^(?:.*/)?scripts/release/cuda-artifact-contract\.sh$''']
regexes = ['''^CUDA_DEFAULT_EMBEDDER_TOKENIZER_SHA256='[0-9a-f]{64}'$''']

[[rules.allowlists]]
description = "TinyBERT tokenizer digest export is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^(?:.*/)?scripts/release/cuda-artifact-contract\.sh$''']
regexes = ['''^CUDA_RERANKER_TOKENIZER_SHA256='[0-9a-f]{64}'$''']

[[rules.allowlists]]
description = "TinyBERT tokenizer digest is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^(?:.*/)?scripts/release/cuda-package-rehearsal-smoke\.sh$''']
regexes = ['''^tokenizer\.json": "[0-9a-f]{64}"$''']

[[rules.allowlists]]
description = "N-API rustup bootstrap digest is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^(?:.*/)?scripts/release/napi-artifact-contract\.sh$''']
regexes = ['''^NAPI_RUSTUP_INIT_SHA256='[0-9a-f]{64}'$''']

[[rules.allowlists]]
description = "CUDA preflight-v2 fixtures contain only artifact-integrity digests"
condition = "AND"
regexTarget = "secret"
paths = ['''^scripts/tests/fixtures/cuda-preflight-v2/valid/(?:cuda-preflight-witness|model-cache-manifest|smoke-cache-topology)\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "Slice 72 CE tokenizer digest is artifact-integrity metadata"
condition = "AND"
regexTarget = "match"
paths = ['''^dev/plans/0\.8\.25/features/slice-72/ce-profile-manifest\.json$''']
regexes = ['''^tokenizer\.json": "[0-9a-f]{64}"$''']

[[rules.allowlists]]
description = "Slice 72 CE receipts contain only artifact and evidence digests"
condition = "AND"
regexTarget = "secret"
paths = ['''^dev/plans/runs/0\.8\.25-slice-72/(?:receipt\.json|(?:baseline|candidate)-(?:cpu|cuda)/(?:baseline|candidate)-(?:cpu|cuda)\.json)$''']
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "Slice 85 CE overlay contains only copied artifact-integrity digests"
condition = "AND"
regexTarget = "secret"
paths = ['''^dev/plans/runs/0\.8\.25-slice-85/slice72-ce-manifest\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "Slice 75 closure manifest contains only reviewed artifact and evidence digests"
condition = "AND"
regexTarget = "secret"
paths = ['''^dev/plans/0\.8\.25/features/slice-75/slice75-closure-manifest\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "code-marker drift evidence carries two reviewed marker identifiers"
condition = "AND"
regexTarget = "secret"
paths = ['''^dev/experiments/code-markers-eval/out/drift\.jsonl$''']
regexes = ['''^(?:ADR-0\.6\.0-retrieval-latency-gates|ADR-0\.8\.1-byo-llm)$''']

[[rules.allowlists]]
description = "code-marker inventory evidence carries two reviewed marker identifiers"
condition = "AND"
regexTarget = "secret"
paths = ['''^dev/experiments/code-markers-eval/out/incode_markers\.jsonl$''']
regexes = ['''^(?:ADR-0\.6\.0-retrieval-latency-gates|ADR-0\.8\.1-byo-llm)$''']
