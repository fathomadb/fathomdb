# Every test the feature-complete gate (scripts/test-feature-complete.sh) may
# legitimately not run. `id` is `<crate>::<target>` (the whole target) or
# `<crate>::<target>::<test path>`. Classes:
#   ignored-by-design  a test that must never run directly (`#[ignore]`d on purpose)
#   opt-in-experiment  a single test that needs an explicit opt-in or gitignored
#                      inputs to be live; it must set `exclude = true`, and the
#                      gate never runs it (it must still be listed, or the entry
#                      is stale)
#   benign-message     prints a skip marker for something harmless
#   platform-excluded  a whole target whose file-level cfg excludes some hosts;
#                      `excluded_on` is the host cfg predicate where it applies
# The gate runs with FATHOMDB_REQUIRE_LIVE=1, so a test whose provisioned
# prerequisite (weights, GPU, ONNX Runtime, runner environment) is missing
# panics instead of skipping. Any skip marker from a test that runs fails the
# gate unless the test is a benign-message entry; an ignored test fails it
# unless it is an ignored-by-design entry; and an entry that no longer matches
# anything fails it (scripts/check-test-target-coverage.py checks the static
# half on every fast-tier run).

[[entry]]
id = "fathomdb-embedder::aarch64_candle_cpu"
class = "platform-excluded"
excluded_on = 'not(all(target_arch = "aarch64", target_os = "linux"))'
reason = "#![cfg(all(target_arch = \"aarch64\", target_os = \"linux\", ...))]: the Jetson Candle CPU check compiles to nothing elsewhere and runs on aarch64 Linux hosts."

[[entry]]
id = "fathomdb-embedder::tegra_fragmented_va_cuda"
class = "platform-excluded"
excluded_on = 'not(all(target_arch = "aarch64", target_os = "linux"))'
reason = "#![cfg(all(target_os = \"linux\", target_arch = \"aarch64\", feature = \"embed-cuda\"))]: the Jetson default-memory-pool regression maps address-space blockers before cuInit and asserts the default pool is unavailable and the synchronous allocator was selected. It compiles to nothing off aarch64 Linux. On aarch64 Linux it asserts only on the measured target, an integrated cuda:0 with the Jetson AGX Orin 64 GB's 60-64 GiB of device memory. On a host that is not Tegra (no /etc/nv_tegra_release and no nvidia,tegra* device-tree entry) it prints SKIP before mapping any blocker. With no CUDA driver, the toolkit's stub libcuda (CUDA_ERROR_STUB_LIBRARY), no device (CUDA_ERROR_NO_DEVICE), a discrete cuda:0 or another memory size it prints SKIP (a panic under FATHOMDB_REQUIRE_LIVE=1); any other driver failure, cuInit's CUDA_ERROR_OUT_OF_MEMORY included, fails it, and an occupied blocker address fails it only on the measured target."

[[entry]]
id = "fathomdb-embedder::slice31_cuda_library_major"
class = "platform-excluded"
excluded_on = 'not(target_os = "linux")'
reason = "#![cfg(all(target_os = \"linux\", feature = \"embed-cuda\"))]: the 0.8.28 Slice 31 D-18 tests put decoy cuBLAS files (built by cc) on LD_LIBRARY_PATH in child processes and read /proc/self/maps, so the target compiles to nothing off Linux. On Linux the feature-complete gate runs it on the RTX 3090s."

[[entry]]
id = "fathomdb-embedder::slice31_cuda_library_major::missing_cuda_12_cublas_is_a_typed_refusal_with_the_remedy"
class = "ignored-by-design"
reason = "#[ignore = \"C3 GCP cell\"]: needs a host with an NVIDIA driver and no CUDA 12 cuBLAS at all (T-CUDA-COMPAT C3, design § 9.3); it fails its precondition on any host with a CUDA toolkit, so it runs only in the owner-approved GCP session with --ignored --exact."

