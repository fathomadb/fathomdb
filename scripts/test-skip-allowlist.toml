# Every test the feature-complete gate (scripts/test-feature-complete.sh) may
# legitimately not run. `id` is `<crate>::<target>` (the whole target) or
# `<crate>::<target>::<test path>`. Classes:
#   ignored-by-design  a test that must never run directly (`#[ignore]`d on purpose)
#   opt-in-experiment  a single test that needs an explicit opt-in or gitignored
#                      inputs to be live; it must set `exclude = true`, and the
#                      gate never runs it (it must still be listed, or the entry
#                      is stale)
#   benign-message     prints a skip marker for something harmless
#   platform-excluded  a whole target whose file-level cfg excludes some hosts;
#                      `excluded_on` is the host cfg predicate where it applies
# The gate runs with FATHOMDB_REQUIRE_LIVE=1, so a test whose provisioned
# prerequisite (weights, GPU, ONNX Runtime, runner environment) is missing
# panics instead of skipping. Any skip marker from a test that runs fails the
# gate unless the test is a benign-message entry; an ignored test fails it
# unless it is an ignored-by-design entry; and an entry that no longer matches
# anything fails it (scripts/check-test-target-coverage.py checks the static
# half on every fast-tier run).

[[entry]]
id = "fathomdb-embedder::aarch64_candle_cpu"
class = "platform-excluded"
excluded_on = 'not(all(target_arch = "aarch64", target_os = "linux"))'
reason = "#![cfg(all(target_arch = \"aarch64\", target_os = \"linux\", ...))]: the Jetson Candle CPU check compiles to nothing elsewhere and runs on aarch64 Linux hosts."

[[entry]]
id = "fathomdb-engine::durability_soak"
class = "platform-excluded"
excluded_on = "not(unix)"
reason = "#![cfg(unix)]: the durability soak uses Unix process and signal APIs; it compiles to nothing on Windows."

