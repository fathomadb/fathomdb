[package]
name = "fathomdb-embedder"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cudarc = { package = "cudarc-fathomdb", version = "=0.19.10", optional = true }
upstream-cudarc = { package = "cudarc", version = "=0.19.4", optional = true }

[features]
embed-cuda = ["dep:cudarc"]
rerank-cuda = ["dep:cudarc"]
tegra-pool = []
flash-attn = ["dep:upstream-cudarc"]
