[package]
name = "fathomdb-inspector"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
fixture-control = []
cached-cpu = ["fathomdb-engine/default-embedder"]

[dependencies]
fathomdb-engine = { path = "../rust/crates/fathomdb-engine", default-features = false }
fathomdb-schema.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "hooks", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
getrandom = "0.3"
libc = "0.2"
sqlite-vec = "=0.1.9"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[build-dependencies]
sha2 = "0.11"
serde_json = "1"

[[example]]
name = "blocked-startup"
required-features = ["fixture-control"]
