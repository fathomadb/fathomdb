[package]
name = "fathomdb-mcp"
description = "FathomDB MCP server: read-only tools over fathomdb-sdk, served over stdio."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Evaluation build; not published until the MCP evaluation is done.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fathomdb-mcp"
path = "src/main.rs"

[dependencies]
# The only FathomDB dependency (MR-070.2, checked by tests/manifest.rs).
fathomdb-sdk.workspace = true
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[features]
default = []
default-embedder = ["fathomdb-sdk/default-embedder"]
# Adapter-only open and call hooks for the readiness, deadline and panic tests
# (MR-003.1, MR-033.1, MR-002.2). No engine hook is involved.
test-seams = []

[dev-dependencies]
# Self dev-dependency so every integration test target links the seams.
fathomdb-mcp = { path = ".", features = ["test-seams"] }
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
proptest = "1"
rmcp = { version = "=3.5.1", features = ["client", "transport-async-rw"] }
# Read-only digest of canonical and op-store rows for the MR-060.1 test. Test
# code only; the adapter itself never links rusqlite (MR-070.2).
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile = "3"
toml = "1"
