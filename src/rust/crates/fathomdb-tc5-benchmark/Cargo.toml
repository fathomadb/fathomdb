[package]
name = "fathomdb-tc5-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
tc5-benchmark = [
    "fathomdb-engine/tc5-benchmark",
    "dep:fathomdb-embedder",
    "dep:fathomdb-embedder-api",
    "fathomdb-embedder/tc5-benchmark",
]
tc5-benchmark-cuda = [
    "tc5-benchmark",
    "fathomdb-engine/embed-cuda",
    "fathomdb-embedder/embed-cuda",
]

[dependencies]
fathomdb-engine = { workspace = true }
fathomdb-embedder = { workspace = true, optional = true }
fathomdb-embedder-api = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "fathomdb-tc5-benchmark"
path = "src/main.rs"
required-features = ["tc5-benchmark"]
