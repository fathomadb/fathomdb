[package]
name = "fathomdb-tc5-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
tc5-benchmark = ["fathomdb-engine/tc5-benchmark"]

[dependencies]
fathomdb-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fathomdb-tc5-benchmark"
path = "src/main.rs"
required-features = ["tc5-benchmark"]
